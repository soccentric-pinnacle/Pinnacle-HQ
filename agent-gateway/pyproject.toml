[project]
name = "pinnaclehq-agent-gateway"
version = "0.1.0"
description = "Pinnacle-HQ agent-gateway: gRPC bidi endpoint for device connections (pairing, heartbeat, telemetry, faults, commands)"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.28",
    "pinnaclehq-api",
    "arq>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "grpcio-tools>=1.66",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["B008", "UP042"]
# Generated protobuf/grpc code -- never hand-edited, don't lint it.
exclude = ["pinnaclehq/agent_pb2.py", "pinnaclehq/agent_pb2_grpc.py", "pinnaclehq/agent_pb2.pyi"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*", "pinnaclehq*"]
